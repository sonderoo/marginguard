<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarginGuard — eBay Profit & Fee Checker</title>
  <link rel="icon" type="image/png" sizes="128x128" href="./logo128.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="./logo128.png?v=2" />
  <link rel="apple-touch-icon" href="./logo128.png?v=2" />
  <style>
    :root {
      --bg: #0c0d10;
      --surface: #14161b;
      --surface-hover: #1b1e25;
      --input-bg: #0a0b0d;
      --border: #242730;
      --border-strong: #343946;
      --text: #f3f4f6;
      --text-secondary: #c5c9d1;
      --muted: #8b919d;
      --accent: #f3f4f6;
      --accent-text: #0c0d10;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.1);
      --green-border: rgba(34, 197, 94, 0.28);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.1);
      --amber-border: rgba(245, 158, 11, 0.3);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.1);
      --red-border: rgba(239, 68, 68, 0.32);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      line-height: 1.6;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Sticky Frosted Navigation */
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(12, 13, 16, 0.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }
    .logo-img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-strong);
    }
    .logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #181a1e;
      border: 1px solid var(--border-strong);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      padding: 7px 14px;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-text) !important;
      font-weight: 600 !important;
      font-size: 13px !important;
    }
    .nav-cta:hover { background: #e2e5e9; }

    /* Hero 2-Column Layout */
    .hero {
      padding: 72px 0 80px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 48px;
      align-items: center;
    }
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; padding: 48px 0 56px; gap: 36px; }
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: #4ade80;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      padding: 4px 11px;
      border-radius: 99px;
      margin-bottom: 20px;
    }
    .tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    h1 {
      font-size: clamp(34px, 4.2vw, 48px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.12;
      margin-bottom: 18px;
    }
    .hero-sub {
      color: var(--text-secondary);
      font-size: 16px;
      margin-bottom: 28px;
      max-width: 500px;
    }
    .cta-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 14.5px;
      text-decoration: none;
      transition: transform 0.16s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
    }
    .btn-primary:hover { background: #e2e5e9; }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border-strong);
    }
    .btn-secondary:hover { background: var(--surface-hover); border-color: #4b5263; }

    .trust-strip {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--muted);
    }
    .trust-strip span { display: inline-flex; align-items: center; gap: 6px; }
    .trust-strip span::before { content: "✓"; color: var(--green); font-weight: 700; }

    /* Interactive Demo Card in Hero */
    .demo-shell {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      transition: border-color 0.25s ease;
    }
    .demo-shell:hover { border-color: #474e5e; }
    .demo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .demo-header strong { color: var(--text); font-size: 13px; }
    .demo-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
    }
    .demo-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .demo-field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .demo-field input {
      width: 10
