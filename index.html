<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarginGuard — eBay Profit & Fee Checker</title>
  <meta name="description" content="See your real eBay profit inside Seller Hub before fees and ad rates eat it. Calculate exact Suggested Prices and Lowest Offers to Accept." />
  <link rel="icon" type="image/png" sizes="128x128" href="./logo128.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="./logo128.png?v=2" />
  <link rel="apple-touch-icon" href="./logo128.png?v=2" />
  <style>
    :root {
      --bg: #090a0d;
      --surface: #12141a;
      --surface-hover: #181b23;
      --input-bg: #0a0b0e;
      --border: #20232d;
      --border-strong: #2f3442;
      --text: #f3f4f6;
      --text-secondary: #c5c9d1;
      --muted: #8b919d;
      --accent: #f3f4f6;
      --accent-text: #090a0d;
      --green: #22c55e;
      --green-text: #4ade80;
      --green-bg: rgba(34, 197, 94, 0.1);
      --green-border: rgba(34, 197, 94, 0.28);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.1);
      --amber-border: rgba(245, 158, 11, 0.3);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.1);
      --red-border: rgba(239, 68, 68, 0.32);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(34, 197, 94, 0.09), transparent 65%),
        radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px;
      background-repeat: no-repeat, repeat;
      color: var(--text);
      line-height: 1.6;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Sticky Frosted Navigation */
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 10, 13, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }
    .logo-img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-strong);
    }
    .logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #181a1e;
      border: 1px solid var(--border-strong);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
    }
    .nav-links a, .nav-links button.nav-link-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .nav-links a:hover, .nav-links button.nav-link-btn:hover { color: var(--text); }
    .nav-cta {
      padding: 7px 14px;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-text) !important;
      font-weight: 600 !important;
      font-size: 13px !important;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .nav-cta:hover { background: #e2e5e9; transform: translateY(-1px); }
    @media (max-width: 720px) {
      .nav-links a:not(.nav-cta), .nav-links button.nav-link-btn { display: none; }
    }

    /* Hero 2-Column Layout */
    .hero {
      padding: 68px 0 64px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 48px;
      align-items: center;
    }
    @media (max-width: 880px) {
      .hero { grid-template-columns: 1fr; padding: 44px 0 48px; gap: 36px; }
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--green-text);
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 18px;
    }
    .tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    h1 {
      font-size: clamp(34px, 4.3vw, 50px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 18px;
      background: linear-gradient(180deg, #ffffff 30%, #a5adba 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-sub {
      color: var(--text-secondary);
      font-size: 16px;
      margin-bottom: 28px;
      max-width: 500px;
    }
    .cta-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 14.5px;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      font-family: inherit;
      transition: transform 0.16s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1);
    }
    .btn-primary:hover { background: #e2e5e9; }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border-strong);
    }
    .btn-secondary:hover { background: var(--surface-hover); border-color: #4b5263; }

    .trust-strip {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--muted);
    }
    .trust-strip span { display: inline-flex; align-items: center; gap: 6px; }
    .trust-strip span::before { content: "✓"; color: var(--green); font-weight: 700; }

    /* Interactive Demo Card in Hero */
    .demo-shell {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 20px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 28px 70px rgba(0, 0, 0, 0.65);
      transition: border-color 0.25s ease;
    }
    .demo-shell:hover { border-color: #474e5e; }
    .demo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 13px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .demo-header strong { color: var(--text); font-size: 13.5px; }
    .preset-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .preset-btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--input-bg);
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .preset-btn:hover, .preset-btn.active {
      background: var(--surface-hover);
      color: var(--text);
      border-color: #6b7280;
    }
    .demo-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .demo-field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .demo-field input {
      width: 100%;
      padding: 8px 9px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--input-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      outline: none;
    }
    .demo-field input:focus { border-color: #9ca3af; }

    .demo-toggles {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 13px;
    }
    .toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .toggle-chip input { accent-color: var(--green); cursor: pointer; }
    .toggle-chip.checked {
      border-color: var(--green-border);
      background: var(--green-bg);
      color: #bbf7d0;
    }

    .demo-result {
      background: #0b0c10;
      border: 1px solid var(--border);
      border-left: 3px solid var(--red);
      border-radius: 8px;
      padding: 14px;
      transition: border-left-color 0.2s ease;
    }
    .demo-result.safe { border-left-color: var(--green); }
    .demo-item-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .demo-meta { font-size: 12px; color: var(--muted); }
    .demo-profit { font-size: 14.5px; margin-top: 5px; }
    .demo-profit strong.neg { color: #f87171; }
    .demo-profit strong.pos { color: var(--green-text); }

    /* Visual Breakdown Bar */
    .bar-wrap { margin-top: 10px; }
    .bar-track {
      height: 7px;
      border-radius: 99px;
      background: #1f222a;
      overflow: hidden;
      display: flex;
    }
    .bar-cost { background: #64748b; transition: width 0.25s ease; }
    .bar-fees { background: #ef4444; transition: width 0.25s ease; }
    .bar-profit { background: #22c55e; transition: width 0.25s ease; }
    .bar-legend {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 5px;
    }
    .legend-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .demo-fix {
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 12px;
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      color: #fde68a;
    }
    .demo-fix.safe {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: #bbf7d0;
    }

    /* Trust & Security Bar */
    .trust-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      padding: 28px 0 56px;
    }
    @media (max-width: 820px) { .trust-bar { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .trust-bar { grid-template-columns: 1fr; } }
    .trust-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .trust-item strong {
      display: block;
      font-size: 13.5px;
      color: var(--text);
      margin-bottom: 3px;
    }
    .trust-item span {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
      display: block;
    }

    /* Sections */
    .section {
      padding: 72px 0;
      border-top: 1px solid var(--border);
    }
    .section-head { margin-bottom: 36px; }
    .section-head.centered { text-align: center; }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--green-text);
      margin-bottom: 8px;
    }
    .section-title {
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .section-sub {
      color: var(--muted);
      font-size: 14.5px;
      margin-top: 8px;
      max-width: 580px;
    }
    .section-head.centered .section-sub { margin: 8px auto 0; }

    /* Before / After Comparison */
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    @media (max-width: 720px) { .compare-grid { grid-template-columns: 1fr; } }
    .compare-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .compare-card.bad { border-top: 3px solid var(--red); }
    .compare-card.good { border-top: 3px solid var(--green); }
    .compare-card h3 { font-size: 16.5px; margin-bottom: 14px; }
    .compare-card ul { list-style: none; display: grid; gap: 10px; }
    .compare-card li {
      font-size: 13.5px;
      color: var(--text-secondary);
      padding-left: 22px;
      position: relative;
    }
    .compare-card.bad li::before { content: "✕"; color: var(--red); position: absolute; left: 0; font-weight: 700; }
    .compare-card.good li::before { content: "✓"; color: var(--green); position: absolute; left: 0; font-weight: 700; }

    /* 3-Step How It Works */
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }
    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      color: var(--green-text);
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .step-card h3 { font-size: 15.5px; margin-bottom: 6px; }
    .step-card p { font-size: 13.5px; color: var(--muted); }

    /* Features Grid */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: inset 0 1px 0 rgba(255
